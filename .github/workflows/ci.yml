name: CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancels in-progress runs for the same branch to save runner minutes and avoid queues
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Prevents jobs from hanging forever

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: recognition-form/pnpm-lock.yaml

      - name: ⚙️ Install Dependencies
        working-directory: recognition-form
        run: pnpm install --frozen-lockfile

      - name: 🚀 Build Project
        working-directory: recognition-form
        run: pnpm run build
